<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anger Management | RPS</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/game.css">
    <link rel="stylesheet" href="css/auth.css"> 
</head>
<body>

    <main id="app-container">

        <!-- 1. HOME SCREEN SECTION -->
        <section id="home-screen" class="view">
            <header class="home-header">
                <!-- Logged Out State -->
                <div id="logged-out-view">
                    <button id="btn-show-login" class="menu-btn small">Login / Register</button>
                </div>
                <!-- Logged In State -->
                <div id="loggedInViewWrapper">
                    <div id="logged-in-view" class="user-stats hidden">
                        <span id="display-username">Player Name</span>
                        <span id="display-record">Record: 0W - 0L</span>
                        <button id="btn-logout" class="text-link">Logout</button>
                    </div>
                </div>
            </header>

            <div class="home-content">
                <h1 class="game-logo">ANGER MANAGEMENT</h1>
                
                <div class="menu-options">
                    <!-- Main Menu Buttons -->
                    <button id="btn-local" class="menu-btn">Local Game (CPU)</button>
                    <button id="btn-online" class="menu-btn">Online Matchmaking</button>
                    <button id="btn-friend-menu" class="menu-btn friend-btn">Play with Friend</button>

                    <!-- Friend Room Sub-Menu (Hidden by default) -->
                    <div id="friend-room-options" class="flex-column gap-15 hidden">
                        
                        <!-- Room Code Card (Shows after Create Room is clicked) -->
                        <div id="room-code-display" class="room-card hidden">
                            <p>Your Room Code</p>
                            <h2 id="display-generated-code">----</h2>
                            <small>Waiting for friend to join...</small>
                        </div>

                        <button id="btn-create-room" class="menu-btn secondary">Create Room</button>
                        
                        <div class="join-group">
                            <input type="text" id="input-room-code" placeholder="CODE" maxlength="4">
                            <button id="btn-join-room" class="menu-btn small">Join</button>
                        </div>
                        
                        <button id="btn-back-menu" class="text-link">← Back to Menu</button>
                    </div>
                </div>

                <p id="home-notification" class="notif-text hidden">Notification text goes here</p>
            </div>
        </section>

        <!-- 2. GAME SCREEN SECTION -->
        <section id="game-screen" class="view hidden">
            <div class="scoreboard flex-center">
                <div class="score-box">
                    <span id="p1-score">0</span>
                </div>
                <div class="vs-text">VS</div>
                <div class="score-box">
                    <span id="p2-score">0</span>
                </div>
            </div>

            <div class="arena-container">
                <div class="fighter-side left">
                    <h3 class="state-label">Your State</h3>
                    <div class="stats-container">
                        <div class="progress-container"><div id="p1-anger" class="progress-bar anger" style="width: 50%;"></div></div>
                        <div class="progress-container"><div id="p1-satisfaction" class="progress-bar satisfaction" style="width: 25%;"></div></div>
                        <div class="progress-container"><div id="p1-confidence" class="progress-bar confidence" style="width: 0%;"></div></div>
                    </div>
                    <div class="hand-wrapper">
                        <img id="p1-hand-visual" src="" alt="P1 Hand">
                    </div>
                </div>

                <div class="fighter-side right">
                    <h3 class="state-label">Opponent</h3>
                    <div class="stats-container">
                        <div class="progress-container"><div id="p2-anger" class="progress-bar anger" style="width: 50%;"></div></div>
                        <div class="progress-container"><div id="p2-satisfaction" class="progress-bar satisfaction" style="width: 25%;"></div></div>
                        <div class="progress-container"><div id="p2-confidence" class="progress-bar confidence" style="width: 0%;"></div></div>
                    </div>
                    <div class="hand-wrapper">
                        <img id="p2-hand-visual" src="" alt="P2 Hand">
                    </div>
                </div>
            </div>

            <div class="controls-center">
                <!-- NEW: Announcer Text Element added here -->
                <div id="announcer-text" class="announcer">WAITING FOR MOVE...</div>

                <div id="rps-controls" class="control-group">
                    <button id="btn-rock" class="move-btn"><img src="" alt="Rock"></button>
                    <button id="btn-paper" class="move-btn"><img src="" alt="Paper"></button>
                    <button id="btn-scissors" class="move-btn"><img src="" alt="Scissors"></button>
                </div>

                <div id="action-controls" class="control-group hidden">
                    <button id="btn-punch" class="action-btn"><img src="" alt="Punch"></button>
                    <button id="btn-kick" class="action-btn"><img src="" alt="Kick"></button>
                    <button id="btn-slap" class="action-btn"><img src="" alt="Slap"></button>
                </div>
                
                <button id="btn-give-up" class="secondary-btn">Give Up</button>
            </div>
        </section>

        <!-- 3. AUTH MODAL -->
        <div id="auth-modal" class="modal hidden">
            <div class="modal-content">
                <span class="close-modal">&times;</span>
                
                <div id="login-form-container">
                    <h2>Welcome Back</h2>
                    <form id="form-login">
                        <input type="text" id="login-user" placeholder="Username" required>
                        <input type="password" id="login-pass" placeholder="Password" required>
                        <button type="submit" class="menu-btn">Login</button>
                    </form>
                    <p>New player? <a href="#" id="link-to-register">Register here</a></p>
                </div>

                <div id="register-form-container" class="hidden">
                    <h2>Create Account</h2>
                    <form id="form-register">
                        <input type="text" id="reg-user" placeholder="Username" required>
                        <input type="password" id="reg-pass" placeholder="Password" required>
                        <select id="reg-gender" required>
                            <option value="" disabled selected>Select Gender</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                            <option value="other">Other</option>
                        </select>
                        <label>Date of Birth</label>
                        <input type="date" id="reg-dob" required>
                        <button type="submit" class="menu-btn">Sign Up</button>
                    </form>
                    <p>Already have an account? <a href="#" id="link-to-login">Login here</a></p>
                </div>
            </div>
        </div>

    </main>

    <!-- SCRIPTS -->
    <script src="js/assets.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/socket.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
